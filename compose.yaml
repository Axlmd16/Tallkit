name: sys-taller

services:
  db:
    image: postgres:17.11-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sys_taller}
      POSTGRES_USER: ${POSTGRES_USER:-sys_taller}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sys_taller_dev}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sys_taller}:${POSTGRES_PASSWORD:-sys_taller_dev}@db:5432/${POSTGRES_DB:-sys_taller}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:55173}
      APP_LANGUAGE_CODE: ${APP_LANGUAGE_CODE:-es-ec}
      APP_TIME_ZONE: ${APP_TIME_ZONE:-America/Guayaquil}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    command: ["sh", "-c", "python manage.py migrate --noinput && python manage.py runserver 0.0.0.0:8000"]
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - uv_cache:/root/.cache/uv
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  frontend:
    image: node:24.20.0-bookworm-slim
    working_dir: /app
    environment:
      VITE_PROXY_TARGET: http://backend:8000
      BUILD_OUT_DIR: /tmp/sys-taller-dist
      COVERAGE_DIR: /tmp/sys-taller-coverage
    command: ["sh", "-c", "npm ci && npm run dev"]
    ports:
      - "${FRONTEND_PORT:-55173}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - npm_cache:/root/.npm
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5173').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

volumes:
  postgres_data:
  backend_venv:
  frontend_node_modules:
  npm_cache:
  uv_cache:
