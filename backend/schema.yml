  /api/v1/fiscal/archive/:
    get:
      operationId: fiscal_archive_retrieve
      description: Lista paginada de evidencia externa no verificada ante el SRI según
        el ámbito del usuario; admite filtros por emisor, ambiente, tipo y fecha de
        emisión.
      parameters:
      - in: query
        name: document_type
        schema:
          type: string
          enum:
          - '01'
          - '04'
      - in: query
        name: environment
        schema:
          type: string
          enum:
          - '1'
          - '2'
      - in: query
        name: fiscal_entity_id
        schema:
          type: integer
        description: Emisor.
      - in: query
        name: issued_from
        schema:
          type: string
          format: date
        description: Emisión desde (AAAA-MM-DD).
      - in: query
        name: issued_to
        schema:
          type: string
          format: date
        description: Emisión hasta (AAAA-MM-DD).
      - in: query
        name: page
        schema:
          type: integer
        description: Desde 1; omisión 1.
      - in: query
        name: page_size
        schema:
          type: integer
        description: 1 a 100; omisión 20.
      tags:
      - Fiscal
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalArchivePage'
          description: ''
        '400':
          content:
            application/json:
