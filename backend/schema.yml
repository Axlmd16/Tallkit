components:
  schemas:
    ActionEnum:
      enum:
      - ONLINE_CANCELLATION
      - CREDIT_NOTE
      type: string
      description: |-
        * `ONLINE_CANCELLATION` - ONLINE_CANCELLATION
        * `CREDIT_NOTE` - CREDIT_NOTE
    AdminOperation:
      type: object
      properties:
        id:
          type: integer
        reference:
          type: string
        kind:
          type: string
        state:
          type: string
        version:
          type: integer
        product:
          type: object
          additionalProperties: {}
          nullable: true
        quantity:
          type: string
          nullable: true
        unit_cost:
          type: string
          nullable: true
        entry_value:
          type: string
          nullable: true
        reason:
          type: string
        notes:
          type: string
        external_reference:
          type: string
        corrects_operation_id:
          type: integer
          nullable: true
        reverses_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        posted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - corrects_operation_id
      - created_at
      - entry_value
      - external_reference
      - id
      - kind
      - notes
      - posted_at
      - product
      - quantity
      - reason
      - reference
      - reverses_id
      - state
      - unit_cost
      - version
    AllowedActionsEnum:
      enum:
      - edit
      - issue
      - convert
      - void
      - copy
      - print
      type: string
      description: |-
        * `edit` - edit
        * `issue` - issue
        * `convert` - convert
        * `void` - void
        * `copy` - copy
        * `print` - print
    ArtisanPaymentCorrection:
      type: object
      properties:
        idempotency_key:
          type: string
          description: Clave del intento, 8 a 128 caracteres ASCII.
          pattern: ^[A-Za-z0-9._:-]{8,128}$
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        replacement:
          $ref: '#/components/schemas/ArtisanPaymentReplacement'
      required:
      - idempotency_key
      - operation_id
      - reason
    ArtisanPaymentCreate:
      type: object
      properties:
        idempotency_key:
          type: string
          description: Clave del intento, 8 a 128 caracteres ASCII.
          pattern: ^[A-Za-z0-9._:-]{8,128}$
        operation_id:
          type: string
          format: uuid
          description: Identidad estable de la acción de cobro.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ArtisanPaymentPart'
          description: Dinero recibido; opcional cuando solo se registra una retención.
        withholding:
          allOf:
          - $ref: '#/components/schemas/ArtisanWithholdingInput'
          nullable: true
          description: 'Retención recibida: reduce el saldo sin ser dinero ni medio
            de pago.'
      required:
      - idempotency_key
      - operation_id
    ArtisanPaymentPart:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/MethodEnum'
        amount:
          type: string
          description: USD con hasta dos decimales.
      required:
      - amount
      - method
    ArtisanPaymentReplacement:
      type: object
      properties:
        operation_id:
          type: string
          format: uuid
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ArtisanPaymentPart'
      required:
      - operation_id
      - parts
    ArtisanPendingWithholdingsPage:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: {}
        total_count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        pending_total:
          type: string
          description: Suma de todas las coincidencias.
      required:
      - items
      - page
      - page_size
      - pending_total
      - total_count
    ArtisanReceivablePage:
      type: object
      properties:
        count:
          type: integer
        page:
          type: integer
        page_size:
          type: integer
        total_pages:
          type: integer
        totals:
          type: object
          additionalProperties: {}
          description: Sumas de todas las coincidencias.
        results:
          type: array
          items:
            type: object
            additionalProperties: {}
      required:
      - count
      - page
      - page_size
      - results
      - total_pages
      - totals
    ArtisanWithholdingInput:
      type: object
      properties:
        amount:
          type: string
          description: USD positivo con hasta dos decimales.
        acknowledged:
          type: boolean
          description: Confirma una retención que supera el umbral de advertencia.
      required:
      - amount
    ArtisanWithholdingVoid:
      type: object
      properties:
        idempotency_key:
          type: string
          description: Clave del intento, 8 a 128 caracteres ASCII.
          pattern: ^[A-Za-z0-9._:-]{8,128}$
        reason:
