openapi: 3.0.3
info:
  title: Sys-Inventario API
  version: 1.0.0
  description: Contrato técnico inicial de la API.
paths:
  /api/v1/audit/:
    get:
      operationId: identity_audit_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: from
        schema:
          type: string
          format: date-time
      - in: query
        name: page
        schema:
          type: integer
      - in: query
        name: page_size
        schema:
          type: integer
      - in: query
        name: result
        schema:
          type: string
          enum:
          - DENIED
          - FAILURE
          - SUCCESS
      - in: query
        name: target_id
        schema:
          type: string
      - in: query
        name: target_type
        schema:
          type: string
      - in: query
        name: to
        schema:
          type: string
          format: date-time
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - audit
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditEventPage'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: ''
  /api/v1/audit/{event_id}/:
