        name: person_type
        schema:
          type: string
          enum:
          - JURIDICA
          - NATURAL
        description: Filtrar por tipo de persona
      - in: query
        name: search
        schema:
          type: string
        description: Término de búsqueda parcial (nombre, identificación, teléfono)
