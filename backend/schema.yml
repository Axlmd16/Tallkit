components:
  schemas:
    AdminOperation:
      type: object
      properties:
        id:
          type: integer
        reference:
          type: string
        kind:
          type: string
        state:
          type: string
        version:
          type: integer
        product:
          type: object
          additionalProperties: {}
          nullable: true
        quantity:
          type: string
          nullable: true
        unit_cost:
          type: string
          nullable: true
        entry_value:
          type: string
          nullable: true
        reason:
          type: string
        notes:
          type: string
        external_reference:
          type: string
        corrects_operation_id:
          type: integer
          nullable: true
        reverses_id:
          type: integer
          nullable: true
        created_at:
          type: string
          format: date-time
        posted_at:
          type: string
          format: date-time
          nullable: true
      required:
      - corrects_operation_id
      - created_at
      - entry_value
      - external_reference
      - id
      - kind
      - notes
      - posted_at
      - product
      - quantity
      - reason
      - reference
      - reverses_id
      - state
      - unit_cost
      - version
    ArtisanPaymentCorrection:
      type: object
      properties:
        idempotency_key:
          type: string
          description: Clave del intento, 8 a 128 caracteres ASCII.
          pattern: ^[A-Za-z0-9._:-]{8,128}$
        operation_id:
          type: string
          format: uuid
        reason:
          type: string
          maxLength: 500
        replacement:
          $ref: '#/components/schemas/ArtisanPaymentReplacement'
      required:
      - idempotency_key
      - operation_id
      - reason
    ArtisanPaymentCreate:
      type: object
      properties:
        idempotency_key:
          type: string
          description: Clave del intento, 8 a 128 caracteres ASCII.
          pattern: ^[A-Za-z0-9._:-]{8,128}$
        operation_id:
          type: string
          format: uuid
          description: Identidad estable del cobro.
        parts:
          type: array
          items:
            $ref: '#/components/schemas/ArtisanPaymentPart'
      required:
      - idempotency_key
      - operation_id
      - parts
    ArtisanPaymentPart:
      type: object
      properties:
        method:
          $ref: '#/components/schemas/MethodEnum'
