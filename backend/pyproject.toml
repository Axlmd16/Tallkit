[project]
name = "sys-taller-backend"
version = "0.1.0"
description = "Backend técnico del sistema de gestión del taller automotriz"
requires-python = ">=3.13,<3.14"
dependencies = [
  "django>=5.2.17,<6.2",
  "django-environ>=0.14.0,<0.15",
  "djangorestframework>=3.18.1,<3.19",
  "drf-spectacular>=0.30.0,<0.31",
  "gunicorn>=26.2.0,<27",
  "psycopg[binary]>=3.3.5,<3.4",
  "structlog>=26.1.0,<27",
  "whitenoise>=6.11.0,<7",
]

[dependency-groups]
dev = [
  "django-stubs>=5.2.9,<5.3",
  "djangorestframework-stubs>=3.16,<4",
  "mypy>=1.18.2,<2",
  "pip-audit>=2.9.0,<3",
  "pre-commit>=4.3.0,<5",
  "pytest>=9.0.2,<10",
  "pytest-cov>=7.0.0,<8",
  "pytest-django>=4.11.1,<5",
  "ruff>=0.16.6,<0.17",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "DJ", "PT", "RUF", "S", "SIM"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"src/config/settings/*.py" = ["F403", "F405"]
"src/**/migrations/*.py" = ["E501", "RUF012"]
"tests/**/*.py" = ["S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers --cov=src --cov-branch --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/config/asgi.py", "*/config/wsgi.py", "*/manage.py"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "if __name__ == .__main__.:"]

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
mypy_path = "src"
exclude = ["migrations"]

[tool.django-stubs]
django_settings_module = "config.settings.test"

[[tool.mypy.overrides]]
module = "environ"
ignore_missing_imports = true
