name: Release Windows Package

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Versión del paquete (ej. v1.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Preparar paquete tallkit
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist_pkg/backend dist_pkg/web dist_pkg/infra/windows
          cp -r frontend/dist/* dist_pkg/web/
          cp backend/pyproject.toml backend/uv.lock backend/manage.py dist_pkg/backend/
          cp -r backend/src dist_pkg/backend/
          cp -r infra/windows/* dist_pkg/infra/windows/
          cp infra/windows/.env.windows.example dist_pkg/infra/windows/
          find dist_pkg -name "__pycache__" -type d -exec rm -rf {} +
          (cd dist_pkg && zip -rq "../tallkit-${VERSION}.zip" backend web infra)

      - name: Publicar en GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.VERSION }}
          files: |
            tallkit-${{ env.VERSION }}.zip
            infra/windows/instalar.ps1
            infra/windows/.env.windows.example
          generate_release_notes: true
