schema: spec-driven

context: |
  Proyecto: Sys-Inventario
  Producto: sistema web de gestión integral para un taller automotriz.
  Idioma de la documentación y de los artefactos OpenSpec: español.
  Zona horaria operativa: America/Guayaquil.

  Fuentes de verdad y precedencia:
  1. Las decisiones confirmadas incluidas en este archivo.
  2. docs/negocio/producto/: visión, alcance V1, reglas de negocio y glosario.
  3. docs/negocio/requisitos/: actores, requisitos, casos de uso, interfaz y trazabilidad.
  4. docs/arquitectura/ y docs/architecture/: arquitectura objetivo vigente.
  5. docs/tecnico/: decisiones y restricciones técnicas vigentes.
  6. El código existente solo demuestra el estado actual; no define el comportamiento correcto.
  Si una fuente inferior contradice una superior, aplicar la superior y registrar la brecha.
  Los documentos continúan como borradores; las decisiones confirmadas de este archivo
  sustituyen cualquier marca anterior que todavía las muestre como pendientes.

  Objetivo de V1:
  - Aplicación web para varios usuarios y dispositivos en la red local del taller.
  - Frontend React 19 + TypeScript 6 + Vite.
  - Backend Django 5 + Django REST Framework.
  - PostgreSQL como fuente de verdad.
  - Arquitectura objetivo de monolito modular; no introducir microservicios en V1.
  - API HTTP JSON bajo /api/v1/ y contrato OpenAPI versionado conforme se estabilice.
  - Preparar la arquitectura para una publicación futura en Internet, sin incluirla en V1.

  Separación fiscal obligatoria:
  - Existen dos contribuyentes/RUC legalmente independientes.
  - El RUC comercial gestiona proveedores, ingresos, inventario y ventas de repuestos.
  - El RUC artesanal gestiona mantenimientos, reparaciones, servicios y mano de obra.
  - Clientes, vehículos y usuarios son compartidos.
  - Documentos, series, impuestos, pagos, saldos, anulaciones, facturación y reportes
    permanecen separados por entidad fiscal.
  - Una operación económica pertenece exactamente a una entidad fiscal.
  - Un mantenimiento con repuestos debe vincular una venta comercial independiente.
  - Repuestos y servicios nunca se mezclan en un mismo documento económico o cobro.

  Decisiones funcionales confirmadas:
  - DP-001: V1 opera con una sola bodega. No incluir transferencias ni gestión multibodega.
  - DP-002: no se permite stock negativo. La confirmación debe fallar de forma atómica
    cuando la existencia sea insuficiente.
  - DP-003 (ajustada por DP-035, regla 2, solo en el comprobante): los medios de pago
    iniciales son EFECTIVO y TRANSFERENCIA, combinables en una misma operación. CREDITO es
    una condición de venta, no un medio de pago; se maneja de forma sencilla, sin fecha de
    vencimiento, cuotas ni cronograma. El plazo en días que pide la factura se declara al
    preparar el comprobante y nunca crea un vencimiento.
  - DP-004: V1 no permite descuentos. No mostrar ni aceptar descuentos en proformas,
    ventas, servicios ni mantenimientos.
  - DP-006 (revisión aprobada 2026-09-14): los números internos usan el formato
    `<SERIE>-<SECUENCIAL>`. Las series iniciales son COM-ING, COM-PRO y COM-VEN para
    el RUC comercial, y ART-SER para el RUC artesanal. Cada ámbito mantiene una sola
    serie activa; el contador comienza en 1, se presenta con al menos seis dígitos
    completados con ceros y continúa creciendo sin reinicio anual. Una serie usada se
    sustituye de forma explícita, su código no se reutiliza y los números confirmados
    nunca se reducen, reasignan ni reutilizan. Son números internos y no acreditan una
    factura electrónica ni autorización del SRI.
  - DP-007: un mantenimiento finalizado puede reabrirse mediante una acción explícita,
    autorizada y auditada; no mediante edición genérica del estado.
  - DP-008 (Cliente, revisión aprobada 2026-09-11): exige nombre o razón social,
    tipo de identificación, identificación y teléfono. Email y dirección son opcionales
    durante el registro. Una funcionalidad futura de facturación podrá exigir completar
    los datos fiscales necesarios antes de emitir un comprobante. Los tipos admitidos
    siguen siendo CI de exactamente 10 caracteres y RUC de exactamente 13 caracteres,
    con validación en frontend y backend. V1 no registra clientes sin identificación.
  - DP-008 (Vehículo, revisión aprobada 2026-09-11): exige placa, marca, modelo y
    propietario, que referencia a un Cliente registrado. Color y año son opcionales.
    V1 no registra vehículos sin placa. Marca es un catálogo administrable.
  - DP-008 (Marcas, aprobación 2026-09-11): los tres roles pueden consultar marcas
    de vehículo. Administrador y Encargado del taller pueden crearlas y editarlas;
    solo Administrador puede desactivarlas y reactivarlas.
  - La revisión DP-008 del 2026-09-11 sustituye cualquier obligatoriedad anterior
    diferente, incluidos email y dirección del Cliente y color del Vehículo. Fuente:
    aprobación del usuario y proposal de gestionar-clientes-y-vehiculos. Antes de
    aplicar ese cambio deben estar verificados y cerrados los cambios de identidad
    (gestion-usuarios-autenticacion-roles) y sistema visual
    (establecer-sistema-visual-frontend); esta decisión no los declara cerrados.
  - CT-001: un usuario debe tener uno o más de los tres roles fijos y puede acumularlos.
    Los únicos roles son ADMINISTRADOR, VENDEDOR y ENCARGADO_TALLER. No existen roles
    adicionales, permisos personalizados ni un rol Contador en V1.
  - Interpretación V1 de DM-003: cada vehículo tiene un solo propietario actual, que es
    un Cliente. No modelar copropiedad ni un responsable distinto del propietario.
    Un cambio de propietario no puede alterar el historial de mantenimientos.
  - DP-009: los productos se controlan y venden por presentaciones completas. Cantidad
    conserva valor y unidad de medida, pero presentaciones diferentes tienen código,
    existencia, costo y precio propios. No se venden fracciones de envases abiertos.
  - DP-010: un kit comprado es un producto vendible completo. Puede desarmarse mediante
    una operación explícita que consume el kit, registra los componentes reales y
    distribuye exactamente su costo entre ellos. V1 no arma kits de inventario con piezas sueltas.
  - DP-011 (sustituida en lo relativo al proveedor obligatorio por DP-030): un proveedor
    ocasional solo exige el nombre; identificación y contacto son opcionales. V1 no gestiona
    cuentas por pagar ni pagos a proveedores.
  - DP-012: solo la venta abierta vinculada a un mantenimiento reserva existencias. La
    reserva reduce disponibilidad, no existencia, y no genera Kardex. Proformas y ventas
    directas en borrador no reservan.
  - DP-013: cada pago o abono se aplica a una sola operación elegida por el usuario. Un
    importe destinado a varias ventas se registra como pagos separados. V1 no admite
    anticipos, sobrepagos ni distribución automática entre deudas.
  - DP-014: una devolución de cliente reduce primero el importe exigible; si produce un
    exceso pagado se registra un reembolso trazable, no saldo a favor. Solo los productos
    que el Administrador declare aptos para reventa regresan al inventario.
  - DP-015: un retorno atribuible a un trabajo anterior reabre el mismo mantenimiento y
    agrega una intervención correctiva. No existe módulo de garantías, plazos ni pólizas.
    El trabajo correctivo no se cobra y la reposición de inventario requiere confirmación
    del Administrador como salida sin cargo asumida por el taller.
  - DP-016: materiales propios entregados para uso del taller salen por consumo interno,
    por presentación completa y sin venta al cliente. Los repuestos aportados por el
    cliente no entran al inventario y solo pueden mencionarse en observaciones.
  - DP-017: los precios editados y mostrados en catálogo son valores finales para el
    cliente, con impuesto incluido cuando aplique. Cada operación confirmada conserva
    precio final, base, tarifa, impuesto y total históricos.
  - DP-018 (sustituida en parte por DP-034 en lo relativo a no emitir facturas electrónicas;
    siguen vigentes los documentos internos, que no son facturas, y la identidad y el estado
    independientes de la referencia fiscal): V1 emite documentos internos, no facturas
    electrónicas autorizadas por el SRI. La futura referencia fiscal tendrá identidad y estado
    independientes de la operación.
  - DP-019: existen cierres diarios y cajas lógicas separados por entidad fiscal, aun si
    una misma persona maneja físicamente el dinero. Se desglosan efectivo y transferencia.
  - DP-020: el precio del catálogo de servicios es referencial. El Encargado del taller
    puede definir sin motivo obligatorio el precio aplicado antes de confirmar la operación
    artesanal; el valor confirmado queda histórico.
  - DP-021: un mantenimiento no puede finalizar mientras su venta comercial abierta tenga
    líneas. El Vendedor o Administrador debe confirmar la venta o retirar las líneas no
    utilizadas; finalizar nunca confirma automáticamente la venta.
  - DP-022 (sustituida por DP-030 para las entradas nuevas; vigente como historia de las
    compras anteriores): en compras, cada línea selecciona una definición tributaria del
    ámbito comercial, sugerida desde el producto y revisable antes de confirmar, y se clasifica
    como recuperable o no recuperable. No se admite recuperación parcial. El impuesto
    recuperable se excluye del valor inventariable; el no recuperable se suma a él.
  - DP-023 (sustituida por DP-030 en lo relativo a importes de compra; el costo unitario y el
    promedio conservan su precisión): base, impuesto y total de cada línea de compra se
    redondean a centavos con HALF_UP y los totales del documento suman las líneas ya
    redondeadas. El costo unitario de captura admite hasta seis decimales y el costo derivado
    no se redondea antes de valorar. El promedio ponderado se publica con seis decimales
    HALF_UP.
  - DP-024 (sustituida por DP-030 para las entradas nuevas; vigente como historia): la fecha
    del documento del proveedor, obligatoria y no posterior al día de America/Guayaquil, es la
    fecha operativa que resuelve la vigencia tributaria de la compra. El momento efectivo del
    movimiento de inventario es el de confirmación, asignado por el sistema.
  - DP-025 (ventas directas, aprobada 2026-09-20 en la propuesta de
    gestionar-ventas-pagos-credito-simple): importes en USD con precios finales de hasta dos
    decimales y cantidades enteras positivas de presentaciones completas. La venta usa la
    selección tributaria comercial del producto y la fecha efectiva de confirmación en
    America/Guayaquil; no se retrofecha. Con tarifa inclusiva, el total de línea conserva
    cantidad por precio final, la base se redondea a centavos con HALF_UP, el impuesto se
    obtiene por diferencia y el documento suma las líneas ya redondeadas. Una tarifa cero
    debe estar configurada: la ausencia de vigencia es un error, nunca una exención. En
    devoluciones parciales la base y el costo se distribuyen de forma acumulada y el último
    tramo absorbe el residuo. No certifica tarifas ni obligaciones tributarias reales.
  - DP-026 (precio aplicado, aprobada 2026-09-20): la venta toma el precio final vigente del
    catálogo; ningún rol lo edita en la venta y no existen descuentos, ni siquiera de valor
    cero. Un cambio de precio corresponde al catálogo y a su permiso administrativo; si cambia
    antes de confirmar, la confirmación exige una nueva revisión con los valores actuales.
  - DP-027 (contado y cobro, aprobada 2026-09-20; ajustada por DP-035, regla 2: el crédito sigue
    sin vencimiento y solo la factura declara un plazo): confirmar y cobrar son acciones
    independientes. Una venta de contado solicita después un cobro completo; si se interrumpe,
    permanece confirmada y pendiente, sin convertirse en crédito ni marcarse pagada. El crédito
    admite abonos parciales sin vencimiento, cuotas ni intereses. La fecha de cobro es la del
    sistema; no se admite captura retroactiva.
  - DP-028 (correcciones, aprobada 2026-09-20): la anulación total por error solo procede sin
    devoluciones previas y con restitución segura del inventario; con movimientos posteriores
    se orienta a una devolución trazable sin reescribir la valoración histórica. Las
    devoluciones físicas admiten movimientos posteriores y usan el costo histórico y la
    inspección de aptitud. El reembolso lo registra expresamente el Administrador con medio
    real, como hecho ya realizado; mientras tanto la obligación pendiente permanece visible y
    no existe saldo a favor. Estas cuatro decisiones no cierran DM-001 ni las validaciones
    contables y tributarias externas.
  - DP-029 (integración de mantenimiento, aprobada 2026-09-24 en la propuesta de
    integrar-mantenimiento-ventas-cobros-por-ruc, P1…P7): DM-001 se cierra para V1 con
    estructuras separadas por RUC (la operación artesanal ART-SER y sus pagos son propios del
    taller) y reglas monetarias puras compartidas. La operación artesanal extiende a los
    servicios la condición contado/crédito de DP-027 y el desglose inclusivo de DP-025 con la
    tarifa artesanal configurada. Se documentan, una sola vez, las líneas iniciales pendientes
    en cualquier estado de la orden; finalizar no exige documentarlas ni cobrarlas. La venta
    vinculada confirmada no se anula; la operación artesanal la anula solo el Administrador y
    sin pagos vigentes. En una orden reabierta no se agregan repuestos cobrables. Cliente y
    vehículo se bloquean cuando existen documentos vinculados.
  - DP-030 (entradas de stock, aprobada 2026-10-04 en la propuesta de
    simplificar-entradas-de-stock-por-vendedor, D1…D5 y R1…R6): el cliente prescinde de la
    revisión del Administrador y de conservar costos y documentos del proveedor. El ingreso
    de mercadería pasa a ser una **entrada de stock** que el Vendedor (y el Administrador)
    registra y confirma en una sola acción, con revisión previa y sin borrador persistente.
    Solo exige productos activos y cantidades enteras de presentaciones completas; proveedor,
    referencia externa de texto libre, observación y costo unitario son opcionales y no se
    registran impuestos, fecha documental ni totales. Una entrada sin costo se valora al
    promedio vigente (o al último conocido) y, si el producto nunca tuvo costo, queda **sin
    costo registrado**, estado distinto del costo cero; la primera entrada con costo valora a
    ese costo las unidades previas y deja constancia. Una entrada igual de hoy se advierte y
    exige reconocimiento, sin bloquear. Solo el Administrador anula, con la regla
    conservadora vigente. Las compras anteriores se conservan como historia de solo lectura.
    El Vendedor nunca recibe costos, promedio ni valoración. Queda pendiente la validación
    con un contador del efecto de dejar de registrar el IVA de compras y de mantener
    existencias sin valor.
  - DP-031 (perfil del emisor y códigos del comprobante, aprobada 2026-10-05 en la propuesta de
    estructurar-perfil-del-emisor-y-codigos-fiscales, D1…D5): el perfil tributario de cada
    entidad fiscal se declara con valores cerrados representables en el esquema de factura del SRI:
    régimen (General, RIMPE Emprendedor o RIMPE Negocio Popular), contabilidad SI o NO, agente de
    retención y contribuyente especial con su número de resolución (1 a 8 dígitos y 1 a 13
    caracteres alfanuméricos) solo cuando aplican, y calificación artesanal con número, organismo
    y vencimiento obligatorio. La leyenda del régimen se deriva y no se escribe. RIMPE Negocio
    Popular no cobra IVA y puede emitir facturas electrónicas de forma voluntaria (confirmado
    por el titular el 2026-10-05, que usará facturas electrónicas): su preparación exige líneas a
    IVA 0 %. Un cambio de régimen o de tarifa se programa a futuro, incluida la correspondencia
    con el SRI, y no altera lo ya preparado. La leyenda de Negocio Popular quedó confirmada
    por DP-035 con el Anexo 22 de la ficha técnica 2.34 (NOR-002); el tope de consumidor final
    para ese régimen sigue por confirmar. D1: un perfil guardado en texto
    libre se conserva como historia, no se convierte y debe declararse de nuevo. D2: el código de
    producto admite hasta 25 caracteres al crearlo o cambiarlo; los anteriores más largos se
    conservan, se localizan con un filtro y bloquean la preparación fiscal de sus operaciones
    sin recortarse. D3: cada servicio recibe del sistema un código SRV-, único e inmutable, que
    es el código de línea de la factura. D4: el aviso de vencimiento de la calificación es de 60
    días. D5: el número de calificación se conserva en la instantánea fiscal y su presentación
    en el comprobante se decide en el cambio de emisión. Mientras la calificación artesanal esté
    vigente solo se preparan líneas con IVA 0 %; vencida, la entidad no prepara facturas. Datos
    confirmados por el titular el 2026-10-04 con la consulta pública de RUC: el RUC artesanal es de
    persona natural en régimen General, no obligado a llevar contabilidad, ni agente de retención
    ni contribuyente especial, y cuenta con calificación artesanal; el RUC comercial cargado es
    provisional y se sustituirá por el definitivo, a nombre de otra persona, al pasar a producción.
    No certifica obligaciones tributarias reales ni cierra la regla de redondeo del IVA incluido.
  - DP-032 (retenciones recibidas, aprobada 2026-10-05 en la propuesta de
    registrar-retenciones-recibidas-en-cobros, D1…D7): algunos clientes son agentes de retención
    y pagan menos que el total de la factura porque entregan la diferencia al SRI a nombre del
    emisor. Esa **retención recibida** se registra como un hecho propio sobre una sola venta
    comercial u operación artesanal confirmada: reduce el saldo pendiente, pero no es un pago ni
    un medio de pago y nunca se cuenta como dinero cobrado. DP-003 no cambia: los medios siguen
    siendo EFECTIVO y TRANSFERENCIA. D1: tablas propias por RUC, como ordena DP-029, y reglas de
    cálculo compartidas. D2: el cobro solo pide el dinero recibido y confirma la diferencia como
    retención; el número, la fecha y el desglose del comprobante se completan después en una
    lista de pendientes. D3: registra y completa quien ya puede cobrar en cada ámbito; solo el
    Administrador anula una retención o corrige un comprobante ya completado. D4: el sistema no
    calcula ni valida porcentajes de retención; advierte, sin bloquear, cuando la retención
    acumulada supera un porcentaje del total configurable por entidad (20 % inicial, se puede
    cambiar o desactivar). D5: la ficha del cliente admite una marca manual «Agente de
    retención» que solo orienta la pantalla de cobro. D6: el desglose entre renta e IVA es
    opcional y su suma iguala el importe retenido. D7: cada entidad activa o desactiva el
    registro de retenciones en su perfil tributario; empieza activado. El saldo pasa a ser
    exigible menos dinero neto y menos retenciones vigentes; el exceso reembolsable se limita
    al dinero efectivamente cobrado y una retención nunca se reembolsa ni crea saldo a favor.
    No se anula una venta ni una operación artesanal con retenciones vigentes. La retención no
    es una forma de pago del comprobante ni exige que exista una preparación fiscal. Ninguna
    regla depende del régimen, la tarifa o las condiciones tributarias de la entidad. Datos
    confirmados por el titular el 2026-10-05: el RUC artesanal recibe comprobantes de retención
    de varios clientes cada mes y hoy factura en el facturador gratuito del SRI. No calcula
    obligaciones tributarias ni acredita que el comprobante exista ante el SRI.
  - DP-033 (proformas comerciales, aprobada 2026-10-06 en la propuesta de
    gestionar-proformas-comerciales, D1…D6): la proforma es una oferta de productos del RUC
    comercial, sin descuentos, reservas, deuda ni cobros. El cliente es opcional (ajuste
    aprobado 2026-10-06): puede cotizarse a quien no está registrado, y la venta generada
    exige un cliente registrado, que se elige al convertir si la oferta no lo tiene. D1: usa
    exclusivamente el precio final de catálogo, sin edición manual; conserva lo cotizado al
    emitir y muestra las diferencias de precio e impuesto al convertir. D2: sugiere 7 días de
    vigencia, ajustables antes de emitir; vale hasta el final del día indicado en
    America/Guayaquil y una vencida no se reactiva: origina una nueva vinculada con valores
    actuales. D3: el borrador se edita libremente y la emitida conserva su contenido; los
    cambios originan una nueva proforma vinculada. D4: se puede cotizar con disponibilidad
    insuficiente, que se informa sin bloquear; confirmar la venta sigue exigiendo stock. D5:
    vista A4 para imprimir o guardar como PDF desde el navegador, con los datos y el logotipo
    del emisor conservados al emitir. El impreso se entrega al cliente: muestra código del
    producto, código del fabricante y marca, y omite disponibilidad, avisos internos, leyendas y la
    mención del sistema (ajuste aprobado 2026-10-06). D6: una proforma vigente se convierte una sola vez en una
    venta en borrador, cuyos productos y cantidades pueden ajustarse sin alterar la oferta ni
    habilitar otra conversión. Se numera con la serie COM-PRO de DP-006; el borrador no consume
    número y anular no lo libera. No es una factura electrónica ni garantiza precios.
  - DP-034 (facturación electrónica en V1, aprobada 2026-11-01 en la propuesta de
    incorporar-facturacion-electronica-en-v1, reglas 1…9): sustituye en parte a DP-018 y
    reemplaza el límite de V1 que excluía la facturación electrónica y la conexión con el SRI.
    Regla 1: V1 emite facturas y notas de crédito autorizadas por el SRI y registra anulaciones;
    guía de remisión, nota de débito, liquidación de compra y retención emitida quedan fuera.
    Regla 2: la emisión pasa por un proveedor de emisión, que genera el XML, lo firma, lo envía
    al SRI y genera el RIDE; Tallkit reúne los datos, solicita la emisión, guarda el resultado y
    conserva su propia copia, y no firma ni custodia la firma electrónica. Regla 3: el proveedor
    es reemplazable; cambiarlo significa agregar un adaptador y cambiar una configuración, sin
    tocar ventas, taller, cobros ni pantallas. El proveedor inicial es Factuplan (elegido el
    2026-11-01), sujeto a obtener una autorización real del SRI. Regla 4: V1 incluye los dos RUC
    y cada uno se activa por separado para la facturación diaria; el artesanal no espera al
    comercial, que además necesita su RUC definitivo, su firma vigente y la validación del
    redondeo del IVA. Regla 5: la emisión no gobierna inventario, cobros ni mantenimientos, y
    un fallo de emisión no deshace la venta ni el cobro. Regla 6: solo la emisión necesita
    Internet, y únicamente de salida; sin conexión la operación queda registrada y el
    comprobante espera en Tallkit; el acceso público desde Internet sigue fuera de V1. Regla 7:
    los documentos internos siguen existiendo, no son facturas, y su numeración (DP-006) sigue
    separada de la fiscal. Regla 8: registrar esta decisión no habilita la emisión real; hasta
    habilitarla, el sistema opera solo en pruebas y rechaza producción. Regla 9: antes de la
    facturación diaria se permite una prueba real supervisada, con pocas facturas reales de
    operaciones reales cuyo comprador lo acepte, aunque falten la política de conservación y la
    restauración probada; la facturación diaria sigue bloqueada hasta tenerlas, y la cantidad y
    los casos se fijan antes de emitir. Choques resueltos: reemplazan DP-018 en parte, el límite
    de V1, alcance-v1 (secciones 1, 2.2 y 6, y FUT-001), RF-REP-014 y la exclusión final de
    requisitos; se ajustan RF-FIS-003, RN-FIS-012, RN-FIS-014, RF-FIS-006, RNF-DIS-001 y
    ADR-0010; se mantienen DP-006 y las reglas que separan el documento interno de la factura;
    se aplazan la convivencia del comprobante interno con el RIDE y los permisos de emisión.
    No certifica el cumplimiento tributario ni verifica ninguna norma: eso corresponde a la
    matriz de normas.
  - DP-035 (datos del comprobante, ajustada en su regla 1 por DP-036, regla 4, desde U6; aprobada 2026-11-01 en la propuesta de
    alinear-datos-del-comprobante-con-sri, reglas 1…5): no sustituye a ninguna decisión; ajusta
    DP-003, DP-027 y DP-031 con excepciones escritas y aplica lo que DP-008 ya preveía. Regla 1:
    el correo del comprador es obligatorio al preparar la factura de un comprador identificado
    (cédula, RUC, pasaporte o identificación del exterior) porque la ficha técnica 2.34 obliga a
    enviarle cada comprobante (NOR-001); se completa en la preparación sin cambiar la ficha del
    cliente, el registro del cliente sigue sin exigirlo, consumidor final queda como estaba hasta
    el cambio 6 y confirmar o cobrar nunca lo piden. Regla 2: al preparar una operación a crédito
    con saldo pendiente se declara un único plazo en días (1 a 9999) con unidad fija «dias»; es solo
    un dato del comprobante: no crea vencimiento, cuotas, mora ni alertas y no cambia saldos ni
    cobros. Se aplica a las formas de pago que cubren lo todavía pendiente. Lo que la ficha deja
    indefinido, si una venta a crédito sin fecha acordada debe llevarlo, consta en NOR-019 y en la
    validación V-6. Regla 3: cada línea de servicio admite una nota opcional de hasta 300
    caracteres que el Encargado escribe en el mantenimiento; se conserva al confirmar la operación
    artesanal, aparece en su comprobante interno y llega precargada a la preparación, donde puede
    ajustarse sin tocar la operación. Regla 4: las leyendas del emisor se derivan del perfil y
    nadie las escribe; RIMPE Negocio Popular lleva «CONTRIBUYENTE NEGOCIO POPULAR - RÉGIMEN RIMPE»
    según el Anexo 22, aunque el XSD 2.1.0 solo admite la leyenda de RIMPE Emprendedor (NOR-020,
    por resolver antes de activar un RUC en ese régimen); el contribuyente especial admite de 3 a
    13 caracteres y el agente de retención no admite ceros a la izquierda. Regla 5: gran
    contribuyente es una condición nueva del perfil con su número de resolución, que el Anexo 24
    pide en la información adicional; un perfil existente queda en «Falta completar» hasta
    declararla. Además, el detalle adicional admite hasta 12 datos de nombre y valor, y los nombres
    «RUC Proveedor» y «Gran Contribuyente» los pone el sistema. Choques resueltos: se mantienen
    DP-008 (el correo se exige al facturar, como ya preveía) y DP-006; se ajustan DP-003, DP-027,
    DP-031, RN-VEN-008, RF-PAG-012 y las specs de preparación y de configuración fiscal; se
    aplazan el redondeo del IVA incluido de DP-025 (V-5, condiciona la activación del RUC
    comercial), el ambiente por RUC (cambio 3) y la comprobación del RUC Proveedor (cambio 4).
    Una factura a un cliente sin correo no puede prepararse con sus datos hasta que se lo
    completa; el cambio 5 revisa la entrega impresa. No certifica el cumplimiento tributario ni
    verifica ninguna norma: eso corresponde a la matriz de normas.
  - DP-036 (uso diario, aprobada 2026-11-03 en la propuesta de
    reenfocar-tallkit-en-el-uso-diario, reglas 1…8; decidida por el titular el 2026-11-01): no
    sustituye a ninguna decisión; ajusta DP-035 y reemplaza reglas de interfaz con excepciones
    escritas. Regla 1: Tallkit se diseña para la usuaria diaria, la persona que atiende cada día,
    sin conocimientos contables y con los roles Administrador, Vendedor y Encargado del taller
    acumulados (CT-001); la tabla de permisos no cambia y lo poco frecuente se agrupa en
    «Ajustes». Regla 2: una sola pantalla, «Cobrar y facturar», abierta desde el mantenimiento o
    la venta, resuelve repuestos y servicios con los dos importes, dos cobros y dos facturas a la
    vista; por dentro siguen siendo operaciones separadas, cada una con su entidad fiscal, número,
    pagos y factura; quien no tiene permiso sobre una parte solo ve la suya, y esa pantalla es la
    única revisión. Regla 3: las pantallas identifican cada negocio por su nombre comercial o, si
    no lo tiene, por su razón social, en lugar de «RUC comercial» y «RUC artesanal»; el RUC sigue
    visible en facturas, comprobantes y «Ajustes»; los conceptos internos siguen existiendo, pero
    no se muestran si no ayudan a la tarea. Regla 4: al facturar, una casilla activada por omisión
    guarda el correo del comprador en la ficha del cliente; desactivada, el correo queda solo en
    esa factura; registrar un cliente sigue sin exigirlo. Regla 5: la búsqueda global localiza por
    placa, cliente, producto o factura desde cualquier pantalla y el servidor decide qué resultados
    puede ver cada rol. Regla 6: se reemplaza la dirección visual de septiembre; la nueva se
    escribe al aprobar el prototipo (U2) y la anterior sigue vigente hasta U3. Regla 7: los
    objetivos de rapidez pasan a ser requisitos (RNF-USA-013…016), provisionales y medidos con el
    método de la línea base; ninguno se alcanza omitiendo una regla vigente. Regla 8: registrar
    esta decisión no cambia ninguna pantalla; cada regla rige al archivar el cambio que la
    implementa (U3 a U6 de docs/cambios-pendientes.md) y hasta entonces siguen las specs
    vigentes; tampoco habilita la emisión real (DP-034, regla 8). Choques resueltos: se ajustan
    DP-035 (regla 1, desde U6), RN-CLI-003, el modelo de dominio §11.6, RNF-USA-009 y RNF-USA-010
    (desde U4), interfaz-y-navegacion §2.1 (U5), §6.6 y §8.1, RNF-USA-003 y PPF-06 (U6); se
    reemplazan en U3 la dirección visual de DESIGN.md y de las specs visuales, y en U4 la
    navegación por áreas de §2.2; se mantienen DP-006, DP-008, DP-013, DP-021, DP-027, RN-FIS-009,
    la tabla de permisos, la separación de funciones críticas de actores-y-roles §5 y el rechazo
    de un pago repartido sin importes por negocio; se aplazan DP-029 y el permiso del Encargado
    sobre repuestos (U6), qué muestra «Facturas» antes del cambio 3 (U4 y U5), si «Cobrar y
    facturar» también finaliza la orden (U6) y el uso de tableta en el taller (U2). No habilita
    la emisión real ni certifica el cumplimiento tributario.
  - DP-036 aplicada por reorganizar-navegacion-y-lenguaje (U4): el menú tiene nueve entradas planas
    (Inicio, Mantenimientos, Ventas, Facturas, Clientes, Productos, Servicios, Cuentas y Ajustes) y
    cada negocio se nombra por su nombre comercial. Antes del cambio 3, «Facturas» muestra en solo
    lectura las preparaciones locales de los negocios que el usuario puede consultar, con su estado
    local («Borrador», «Preparada, sin enviar», «Cancelada»); ninguna se presenta como enviada,
    autorizada o emitida, y no habilita la emisión real (DP-034, regla 8). La existencia se ve
    en Productos solo con el permiso de inventario y sin costos. El estado «cancelado» de un
    mantenimiento sigue sin implementarse y queda registrado como brecha.
  - Pendientes que esta entrega conserva sin decidir: alertas de umbral de existencia
    (RF-INV-011), archivos adjuntos de ingresos y las demás operaciones futuras de inventario.

  Reglas esenciales de negocio:
  - Las proformas y ventas directas en borrador no reservan ni descuentan stock.
  - La venta de mantenimiento en borrador reserva disponibilidad sin descontar existencia.
  - La existencia disminuye al confirmar una venta o una operación explícita de salida,
    como devolución a proveedor, consumo interno, ajuste, desarme o reposición correctiva.
  - Confirmar una operación económica no implica marcarla pagada o facturada.
  - Estado del documento, estado de pago y estado de facturación son independientes.
  - Los pagos y abonos se registran con medios reales y pertenecen a una sola entidad fiscal.
  - Las entradas de stock confirmadas actualizan existencias y, cuando traen costo, el costo
    promedio ponderado dentro de la misma transacción; el proveedor es opcional (DP-030).
  - Todo cambio de inventario genera un movimiento de Kardex trazable e inmutable.
  - Documentos confirmados no se editan ni eliminan físicamente mediante CRUD ordinario.
  - Anulaciones, devoluciones y correcciones conservan el original, el motivo, el usuario
    y los movimientos compensatorios.
  - Importes y cantidades usan Decimal; nunca punto flotante binario para cálculos.
  - Secuenciales se asignan dentro de la transacción y deben ser seguros ante concurrencia.
  - Acciones críticas deben ser atómicas, idempotentes cuando corresponda y auditables.
  - Los kits se administran como productos completos y solo se descomponen mediante un
    desarme explícito, atómico y trazable; nunca automáticamente al vender.
  - Los valores económicos e impuestos aplicados se conservan como datos históricos.

  Roles y responsabilidades:
  - Administrador: usuarios, configuración, entidades fiscales, catálogos, proveedores,
    entradas de stock (registro y anulación), inventario, ajustes, reportes, auditoría,
    respaldos y acciones críticas.
  - Vendedor: clientes, proformas, ventas y cobros comerciales; registra y confirma entradas
    de stock sin ver costos; confirma la venta de repuestos vinculada a un mantenimiento y
    registra consumos internos solicitados.
  - Encargado del taller: clientes, vehículos, servicios, mantenimientos, fotografías,
    repuestos utilizados, solicitudes de consumo interno, reaperturas y cobros artesanales.
  - El backend es la autoridad de autorización. Ocultar acciones en el frontend solo es
    una ayuda de interfaz y nunca sustituye la validación del servidor.

  Límites de V1:
  - No incluir otros comprobantes electrónicos (guía de remisión, nota de débito,
    liquidación de compra ni retención emitida). La factura, la nota de crédito y la
    anulación, con conexión de salida al SRI mediante un proveedor de emisión, forman parte
    de V1 por DP-034.
  - No migrar automáticamente los pocos registros de la aplicación Flutter anterior.
  - No asignar trabajos a mecánicos.
  - No incluir presupuestos ni aprobación previa del cliente para mantenimientos.
  - No incluir un módulo de garantías, copropiedad vehicular, permisos personalizados,
    microservicios ni acceso público por Internet. La intervención correctiva simple
    confirmada en DP-015 no constituye un módulo de garantías.

  Decisiones todavía no cerradas:
  - DA-002: límites, almacenamiento y conservación de fotografías.
  - DA-003: cerrada en `instalar-en-windows-local` (`ADR-0013`, 2026-11-20) con despliegue nativo en
    Windows 11 Pro (PostgreSQL, Waitress, Caddy y WinSW), actualizaciones vía GitHub Releases y
    respaldos diarios cifrados en AES-256 hacia disco USB externo y Google Drive.
  - DM-001: cerrada para V1 por DP-029 (estructuras separadas por RUC); una estructura común
    futura requiere una nueva decisión.
  - Validación contable y tributaria de consumos internos y reposiciones sin cargo entre
    las dos entidades fiscales.
  - Tarifas y clasificación tributaria reales, reglas de redondeo y requisitos de
    consumidor final.
  - Fecha y plazo del comprobante que espera sin Internet, y si el desarrollador debe
    registrarse como proveedor ante el SRI, hasta verificarlos en la norma oficial (DP-034).
  - Si una venta a crédito sin fecha acordada debe llevar plazo en la factura y con qué número
    (DP-035, NOR-019, V-6); y cuál manda entre la ficha técnica y el XSD 2.1.0 para la leyenda
    de RIMPE Negocio Popular (NOR-020).
  Cuando un cambio dependa de una decisión abierta, su proposal debe recomendar la opción
  más sencilla y segura para V1, explicar impactos y alternativas, y detenerse para obtener
  aprobación. No convertir una decisión abierta en migración, spec o código silenciosamente.

  Arquitectura y desarrollo:
  - Mantener fronteras explícitas entre identidad, configuración fiscal, clientes y
    vehículos, catálogos, proveedores e ingresos, inventario, proformas, ventas y pagos,
    taller, reportes y auditoría.
  - Coordinar reglas complejas mediante servicios de aplicación/dominio; mantener views,
    ViewSets y serializers delgados.
  - El frontend no decide permisos, stock, totales, impuestos, secuenciales ni transiciones.
  - Las escrituras entre módulos pasan por servicios explícitos, no por mutaciones directas
    de modelos ajenos.
  - Usar transacciones, bloqueos de filas, restricciones únicas e idempotencia para dinero,
    inventario, pagos, confirmaciones, anulaciones y secuenciales.
  - Cambios de esquema requieren migraciones versionadas y un plan para datos existentes.
  - Preservar cambios del usuario y no ampliar el alcance para refactorizaciones no solicitadas.

  Estado actual relevante:
  - Backend y frontend implementan los módulos de la línea base: identidad, configuración,
    catálogos, clientes y vehículos, compras e inventario, ventas, proformas, mantenimientos y
    pagos, y la preparación y el seguimiento fiscal. La facturación electrónica opera solo en
    pruebas: la emisión real no está habilitada (DP-034, regla 8).
  - El comportamiento de la aplicación Flutter anterior es histórico y no define requisitos.
  - No preservar compatibilidad con comportamientos históricos que contradigan la línea objetivo.

  Calidad y verificación:
  - Todo comportamiento nuevo o corregido con lógica debe incluir pruebas automatizadas, con la
    exigencia según el riesgo definido en AGENTS.md. Textos, colores y maquetación no requieren
    prueba nueva.
  - Reglas de dominio: pruebas unitarias.
  - API, persistencia y coordinación entre módulos: pruebas de integración.
  - Dinero, stock y secuenciales: pruebas transaccionales y de concurrencia.
  - Permisos: casos positivos y negativos para cada rol relevante y combinaciones de roles.
  - Errores corregidos: prueba de regresión.
  - Frontend: build y lint sin errores introducidos; probar flujos críticos de interfaz.
  - No afirmar que una verificación pasó si no se ejecutó; registrar bloqueos del entorno.

rules:
  proposal:
    - Leer primero la documentación objetivo y los hallazgos EA/BR relacionados con el cambio.
    - Indicar problema, objetivo, alcance, no objetivos, usuarios afectados, dependencias y riesgos.
    - Referenciar las reglas RN, requisitos RF/RNF, casos de uso UC y brechas BR aplicables.
    - Mantener cada propuesta enfocada en una capacidad o conjunto cohesivo de brechas.
    - Distinguir explícitamente reutilización, modificación y sustitución del código actual.
    - Incluir impacto esperado en datos, permisos, API, frontend y operación cuando aplique.
    - Identificar decisiones abiertas y solicitar aprobación de la recomendación antes de specs.
    - No incluir detalles de implementación propios del design ni crear código.
    - Incluir siempre una sección "Fuera de alcance".
    - Detenerse después del proposal y esperar aprobación explícita del usuario.

  specs:
    - Generar specs únicamente después de la aprobación explícita del proposal.
    - Redactar requisitos y criterios de aceptación en español y sin acoplarlos a Django o React.
    - Usar escenarios Dado/Cuando/Entonces para el comportamiento observable.
    - Cada requisito normativo debe contener al menos un escenario verificable.
    - Cubrir flujo principal, validaciones, errores, permisos y transiciones de estado.
    - Para dinero, stock, pagos o secuenciales, cubrir atomicidad, reintentos y concurrencia.
    - Mantener separados RUC comercial y artesanal en todos los escenarios económicos.
    - No introducir descuentos, stock negativo, reservas de proforma ni crédito como medio de pago.
    - Referenciar los identificadores RN/RF/RNF/UC que justifican el comportamiento.
    - No adelantar design, tasks ni implementación.
    - Detenerse después de las specs y esperar aprobación explícita del usuario.

  design:
    - Generar design únicamente después de la aprobación explícita de las specs.
    - Inspeccionar el código real antes de proponer archivos, modelos, endpoints o migraciones.
    - Explicar impactos en backend, frontend, datos, API, seguridad, permisos y operación.
    - Definir límites transaccionales, estrategia de concurrencia e idempotencia cuando aplique.
    - Incluir estrategia de migración y compatibilidad de datos para cambios de esquema.
    - Incluir estrategia de pruebas vinculada a los criterios de aceptación.
    - Usar diagramas C4 o UML solo cuando aclaren arquitectura, relaciones o secuencias complejas.
    - Crear o actualizar un ADR cuando la decisión sea duradera, transversal o costosa de revertir.
    - No resolver silenciosamente decisiones abiertas; usar solo decisiones aprobadas.
    - No crear tasks ni modificar código.
    - Detenerse después del design y esperar aprobación explícita del usuario.

  tasks:
    - Generar tasks únicamente después de la aprobación explícita del design.
    - Dividir el trabajo en tareas pequeñas, ordenadas, implementables y verificables.
    - Separar tareas de backend, frontend, datos/migraciones, pruebas y documentación.
    - Nombrar rutas o módulos reales cuando hayan sido confirmados mediante inspección.
    - Añadir criterio de finalización y comando o evidencia de verificación para cada tarea.
    - Incluir pruebas según el riesgo de AGENTS.md: antes del código en dinero, impuestos, inventario, secuencias, permisos y facturación; al final del grupo en el resto.
    - Incluir migraciones y tratamiento de datos existentes cuando cambie el modelo.
    - Incluir actualización de OpenAPI, trazabilidad y documentación afectada.
    - Ordenar dependencias para no implementar pantallas sobre contratos o modelos inestables.
    - Detenerse después de tasks y esperar aprobación explícita antes de aplicar cambios.

operations:
  apply:
    guidance:
      - Aplicar únicamente tasks aprobadas y marcar progreso con evidencia verificable.
      - Preservar cambios ajenos y evitar refactorizaciones fuera del alcance aprobado.
      - Ejecutar solo las pruebas relacionadas; la verificación completa, únicamente si el titular la pide.
      - No realizar operaciones destructivas sobre datos ni historial sin autorización explícita.
      - Si aparece una contradicción o decisión no resuelta, detener la implementación y documentarla.
  archive:
    guidance:
      - Archivar solo después de verificar criterios de aceptación y tasks completadas.
      - Sincronizar las specs finales y actualizar trazabilidad, documentación y brechas afectadas.
      - Registrar pruebas ejecutadas, resultados, limitaciones y trabajo pendiente real.
